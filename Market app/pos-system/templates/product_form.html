{% extends "base.html" %}

{% block title %}{% if action == 'new' %}Add Product{% else %}Edit Product{% endif %} - Apna Market POS{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">{% if action == 'new' %}➕ Add New Product{% else %}✏️ Edit Product{% endif %}</h1>
  <a href="{{ url_for('products') }}" class="btn btn-outline">← Back to Products</a>
</div>

<div class="card" style="max-width: 700px; margin-inline: auto;">
  <form method="POST">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="sku">SKU / Barcode *</label>
        <input type="text" id="sku" name="sku" class="form-control" value="{{ product.sku if product else '' }}" required placeholder="e.g. SKU-1001 or barcode">
      </div>
      <div class="form-group">
        <label class="form-label" for="category">Category</label>
        <select id="category" name="category" class="form-select">
          {% set curr_cat = product.category if product else 'General' %}
          {% for cat in ['General', 'Grains & Rice', 'Flour & Atta', 'Oils', 'Beverages', 'Snacks', 'Dairy', 'Household', 'Personal Care', 'Confectionery'] %}
            <option value="{{ cat }}" {% if curr_cat == cat %}selected{% endif %}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="name">Product Name *</label>
      <input type="text" id="name" name="name" class="form-control" value="{{ product.name if product else '' }}" required placeholder="e.g. Basmati Rice 1kg">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="cost_price">Cost Price (₹)</label>
        <input type="number" step="0.01" min="0" id="cost_price" name="cost_price" class="form-control" value="{{ product.cost_price if product else '0.00' }}">
      </div>
      <div class="form-group">
        <label class="form-label" for="selling_price">Selling Price (₹) *</label>
        <input type="number" step="0.01" min="0.01" id="selling_price" name="selling_price" class="form-control" value="{{ product.selling_price if product else '' }}" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="stock">Current Stock Quantity</label>
        <input type="number" min="0" id="stock" name="stock" class="form-control" value="{{ product.stock if product else '10' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="min_stock">Low Stock Warning Alert Level</label>
        <input type="number" min="0" id="min_stock" name="min_stock" class="form-control" value="{{ product.min_stock if product else '5' }}" required>
      </div>
    </div>

    <div style="display: flex; gap: 0.75rem; margin-top: 1.25rem;">
      <button type="submit" class="btn btn-primary">{% if action == 'new' %}Create Product{% else %}Update Product{% endif %}</button>
      <a href="{{ url_for('products') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
